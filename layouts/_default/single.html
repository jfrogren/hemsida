{{ define "content" -}}
<article class="post">
  <!-- Inläggets Rubrik -->
  <header class="post-header">
    <h1 class="post-title" style="margin-bottom: 10px;">{{ .Title }}</h1>
    
    <!-- Hämtar inläggets kategorier direkt från din front matter -->
    {{ with .Params.kategorier -}}
      <div class="post-category" style="margin-bottom: 25px; font-size: 0.9em; color: #666;">
        <span class="category-label">Kategorier: </span>
        {{ range $index, $element := . -}}
          {{ if $index }}, {{ end -}}
          {{ partial "category-link.html" $element }}
        {{ end -}}
      </div>
    {{- end }}
  </header>

  <!-- Inläggets Brödtext -->
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{- end }}
